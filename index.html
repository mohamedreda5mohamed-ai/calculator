<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>صمّم موقعك معنا</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#222;
}
header{
  background:#111827;
  color:white;
  padding:45px 20px;
  text-align:center;
}
header h1{font-size:38px;margin:0 0 15px}
header p{font-size:19px;color:#ddd}

.container{
  max-width:900px;
  margin:30px auto;
  padding:20px;
}

.card{
  background:white;
  padding:25px;
  margin-bottom:20px;
  border-radius:18px;
  box-shadow:0 5px 20px #00000012;
}

.price{
  font-size:30px;
  font-weight:bold;
  margin:15px 0;
}

ul{
  line-height:2;
  padding-right:25px;
}

button{
  width:100%;
  padding:15px;
  border:0;
  border-radius:12px;
  background:#16a34a;
  color:white;
  font-size:18px;
  cursor:pointer;
}

button:hover{background:#15803d}

input,textarea{
  width:100%;
  padding:14px;
  margin:8px 0 15px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
}

footer{
  text-align:center;
  padding:25px;
  color:#777;
}
</style>
</head>

<body>

<header>
  <h1>🚀 اعمل موقعك الإلكتروني</h1>
  <p>موقع احترافي وسريع لمشروعك أو محلك بسعر مناسب</p>
</header>

<div class="container">

  <div class="card">
    <h2>💻 موقع تجاري</h2>

    <div class="price">ابتداءً من 300 جنيه</div>

    <ul>
      <li>✅ تصميم مناسب للموبايل</li>
      <li>✅ صفحة لعرض منتجاتك أو خدماتك</li>
      <li>✅ زر واتساب للتواصل</li>
      <li>✅ سرعة تحميل جيدة</li>
      <li>✅ نشر الموقع على الإنترنت</li>
    </ul>

    <button onclick="document.getElementById('order').scrollIntoView()">
      اطلب موقعك الآن
    </button>
  </div>

  <div class="card" id="order">
    <h2>📩 اطلب موقعك</h2>

    <label>اسمك</label>
    <input id="name" placeholder="اكتب اسمك">

    <label>نوع النشاط</label>
    <input id="business" placeholder="مثال: محل ملابس">

    <label>رقم الهاتف</label>
    <input id="phone" placeholder="اكتب رقمك">

    <label>ماذا تريد في الموقع؟</label>
    <textarea id="details" rows="4"
      placeholder="اكتب تفاصيل الموقع الذي تريده"></textarea>

    <button onclick="sendOrder()">
      إرسال الطلب على واتساب
    </button>
  </div>

</div>

<footer>
  جميع الحقوق محفوظة © 2026
</footer>

<script>
function sendOrder(){

  let name = document.getElementById("name").value;
  let business = document.getElementById("business").value;
  let phone = document.getElementById("phone").value;
  let details = document.getElementById("details").value;

  if(!name || !business || !phone){
    alert("من فضلك املأ الاسم والنشاط ورقم الهاتف");
    return;
  }

  // غيّر الرقم ده لرقم واتساب الذي سيستقبل الطلبات
  let whatsapp = "201000000000";

  let message =
    "طلب تصميم موقع جديد%0A%0A" +
    "الاسم: " + encodeURIComponent(name) + "%0A" +
    "النشاط: " + encodeURIComponent(business) + "%0A" +
    "الهاتف: " + encodeURIComponent(phone) + "%0A" +
    "التفاصيل: " + encodeURIComponent(details);

  window.open(
    "https://wa.me/" + whatsapp + "?text=" + message,
    "_blank"
  );
}
</script>

</body>
</html>

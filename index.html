<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حاسبتي الذكية</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #111827, #1e3a8a);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    h1 {
      color: white;
      text-align: center;
      margin-bottom: 15px;
    }

    .calculator {
      background: #18181b;
      padding: 20px;
      border-radius: 25px;
      box-shadow: 0 15px 40px rgba(0,0,0,.4);
    }

    #display {
      width: 100%;
      height: 75px;
      border: none;
      border-radius: 15px;
      margin-bottom: 15px;
      padding: 10px 15px;
      font-size: 30px;
      text-align: right;
      background: #27272a;
      color: white;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      height: 60px;
      border: none;
      border-radius: 15px;
      font-size: 22px;
      cursor: pointer;
      background: #3f3f46;
      color: white;
    }

    button:active {
      transform: scale(.96);
    }

    .operator {
      background: #2563eb;
    }

    .clear {
      background: #dc2626;
    }

    .equal {
      background: #16a34a;
      grid-column: span 2;
    }

    .tools {
      margin-top: 20px;
      background: #27272a;
      padding: 15px;
      border-radius: 18px;
      color: white;
    }

    .tools h2 {
      font-size: 20px;
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 5px 0;
      border: none;
      border-radius: 10px;
      font-size: 17px;
    }

    .discount-btn {
      width: 100%;
      background: #9333ea;
      margin-top: 8px;
      font-size: 18px;
    }

    #discountResult {
      margin: 12px 0 0;
      font-size: 18px;
      line-height: 1.7;
    }

    .footer {
      text-align: center;
      color: #ddd;
      margin-top: 15px;
      font-size: 13px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🧮 حاسبتي الذكية</h1>

  <div class="calculator">

    <input id="display" type="text" value="0" readonly>

    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">C</button>
      <button onclick="deleteLast()">⌫</button>
      <button onclick="add('%')">%</button>
      <button class="operator" onclick="add('/')">÷</button>

      <button onclick="add('7')">7</button>
      <button onclick="add('8')">8</button>
      <button onclick="add('9')">9</button>
      <button class="operator" onclick="add('*')">×</button>

      <button onclick="add('4')">4</button>
      <button onclick="add('5')">5</button>
      <button onclick="add('6')">6</button>
      <button class="operator" onclick="add('-')">−</button>

      <button onclick="add('1')">1</button>
      <button onclick="add('2')">2</button>
      <button onclick="add('3')">3</button>
      <button class="operator" onclick="add('+')">+</button>

      <button onclick="add('0')">0</button>
      <button onclick="add('.')">.</button>
      <button class="equal" onclick="calculate()">=</button>
    </div>

    <div class="tools">
      <h2>💰 حاسبة الخصم</h2>

      <input id="price" type="number" placeholder="السعر">

      <input id="discount" type="number" placeholder="نسبة الخصم %">

      <button class="discount-btn" onclick="calculateDiscount()">
        احسب الخصم
      </button>

      <p id="discountResult"></p>
    </div>

  </div>

  <div class="footer">
    حاسبتي الذكية © 2026
  </div>

</div>

<script>
  const display = document.getElementById("display");

  function add(value) {
    if (display.value === "0") {
      display.value = value;
    } else {
      display.value += value;
    }
  }

  function clearDisplay() {
    display.value = "0";
  }

  function deleteLast() {
    if (display.value.length > 1) {
      display.value = display.value.slice(0, -1);
    } else {
      display.value = "0";
    }
  }

  function calculate() {
    try {
      let expression = display.value.replace(/%/g, "/100");

      let result = Function(
        '"use strict"; return (' + expression + ')'
      )();

      display.value = result;
    } catch {
      display.value = "خطأ";
    }
  }

  function calculateDiscount() {
    const price = Number(document.getElementById("price").value);
    const discount = Number(document.getElementById("discount").value);
    const result = document.getElementById("discountResult");

    if (price <= 0 || discount < 0) {
      result.innerHTML = "اكتب السعر ونسبة الخصم بشكل صحيح.";
      return;
    }

    const discountValue = price * discount / 100;
    const finalPrice = price - discountValue;

    result.innerHTML =
      "قيمة الخصم: " + discountValue.toFixed(2) +
      "<br>السعر بعد الخصم: " + finalPrice.toFixed(2);
  }
</script>

</body>
</html>
